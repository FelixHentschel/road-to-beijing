<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>5000 m</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,500;0,700;0,800;1,800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 80px; background: #0a0a0a; color: #f2f3f4; font-family: Futura, Jost, 'Century Gothic', sans-serif; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-weight: 800; font-style: italic; color: #de1b1b; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase">Road to Beijing 27</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #9aa0a6">Stand 28.10.2026</div>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; border-bottom: 4px solid #f2f3f4; padding-bottom: 24px">
<h1 style="margin: 0; font-weight: 800; font-size: 150px; line-height: 0.85; text-transform: uppercase">5000 m</h1>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 24px; text-align: right; line-height: 1.5">WM-Feld<br><span style="font-size: 52px; color: #de1b1b">42</span><br>vergeben 24 / 29</div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'JetBrains Mono', monospace; font-size: 24px; color: #9aa0a6; text-transform: uppercase; letter-spacing: 0.06em; padding-bottom: 8px">
<span>{{g.sex}}</span><span>Norm {{g.norm}}</span>
</div>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 14px 0; border-top: 1px solid #2a2c2f">
<div style="font-weight: 800; font-size: 76px; line-height: 1; color: {{r.color}}">{{r.place}}</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<div style="font-weight: 700; font-size: 40px; line-height: 1.1">{{r.name}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #9aa0a6">{{r.detail}}</div>
</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 14px; border: 2px solid {{r.color}}; color: {{r.color}}">{{r.label}}</div>
</div>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #6d7278; display: flex; justify-content: space-between; gap: 24px">
<span>Quelle: World Athletics, Road to Beijing 27</span><span style="font-weight: 800; font-style: italic; font-family: Futura, Jost, sans-serif; color: #de1b1b; letter-spacing: 0.1em">AUSLAUFEN</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
const S = { in: ['Qualifiziert', '#de1b1b'], near: ['Nachrücker', '#f2f3f4'], limit: ['Nationen-Limit', '#6d7278'], out: ['Außerhalb', '#6d7278'], none: ['Offen', '#6d7278'] };
const row = (place, name, detail, st) => ({ place, name, detail, label: S[st][0], color: S[st][1] });
return { groups: [
{ sex: 'Frauen', norm: '14:36,00', rows: [row('–', 'Noch keine Deutsche auf der Liste', 'Gezählt wird erst ab Beginn des Quali-Zeitraums', 'none')] },
{ sex: 'Männer', norm: '12:50,00', rows: [row('–', 'Noch kein Deutscher auf der Liste', 'Gezählt wird erst ab Beginn des Quali-Zeitraums', 'none')] }
] };
}
}
</script>
</body>
</html>
